# Khoá = mã lỗi 5 ký tự (error-code-convention §4.1). Mặc định của dự án là tiếng Việt.
# Mỗi mã trong enum ErrorCode PHẢI có một dòng ở đây, nếu không ứng dụng ném lỗi lúc dựng thông điệp.
00000=Success
00101=Yêu cầu không hợp lệ.
00105=Bạn thao tác quá nhanh, vui lòng thử lại sau.
00401=Vui lòng đăng nhập để tiếp tục.
00403=Bạn không có quyền thực hiện thao tác này.
00404=Không tìm thấy nội dung yêu cầu.
00499=Hệ thống đang gặp sự cố, vui lòng thử lại sau.

01101=Thông tin đăng ký chưa hợp lệ, vui lòng kiểm tra lại.
01102=Mật khẩu này quá phổ biến, vui lòng chọn mật khẩu khác.
01103=Bạn cần đồng ý Điều khoản sử dụng để tiếp tục.
01104=Email này đã được xác nhận trước đó.
01105=Mã OTP không đúng, vui lòng kiểm tra lại.
01106=Mã OTP đã hết hiệu lực, vui lòng yêu cầu gửi lại.
01107=Liên kết đặt lại mật khẩu không hợp lệ.
01108=Liên kết đặt lại mật khẩu đã hết hiệu lực, vui lòng thực hiện lại.
01109=Vui lòng chờ ít nhất 60 giây trước khi gửi lại mã.
01201=Email hoặc mật khẩu không đúng.
01202=Bạn đã nhập sai quá nhiều lần. Vui lòng thử lại sau 15 phút.
01203=Tài khoản đang bị tạm khoá. Vui lòng liên hệ hỗ trợ.
01204=Phiên đăng nhập không hợp lệ hoặc đã bị dùng lại. Vui lòng đăng nhập lại.

02201=Nội dung này hiện chưa có.

03101=Bài tập không hợp lệ.
03102=Loại câu trả lời không khớp bài tập.
03201=Bạn cần hoàn thành bài trước đó.

04201=Bạn đã hết lượt tra cứu miễn phí hôm nay. Đăng ký để tra không giới hạn.

06101=Chưa nhận được thanh toán từ ngân hàng hoặc giao dịch chưa hoàn tất. Vui lòng thử lại sau.
06203=Nội dung này thuộc gói Premium.
06204=Bạn đã dùng hết 5 lượt luyện AI hôm nay. Nâng cấp để luyện không giới hạn.

07201=Số dư EXP không đủ để đổi vật phẩm này.
07202=Bạn đã sở hữu vật phẩm này rồi.

10101=Đã có phiên bản mới, vui lòng tải lại trang.
10102=Dữ liệu chuyển động không hợp lệ.
10103=Yêu cầu không hợp lệ.
10104=Hãy thực hiện trọn động tác trong khoảng hai giây.
10201=Ký hiệu này chưa được hỗ trợ chấm tự động.
10202=Bạn chưa bật tính năng góp dữ liệu.
10301=Hệ thống chấm tự động đang bận, bạn thử lại sau ít phút nhé.
10302=Chấm tự động mất nhiều thời gian hơn thường lệ, vui lòng thử lại.
10401=Hệ thống đang gặp sự cố, vui lòng thử lại sau.
