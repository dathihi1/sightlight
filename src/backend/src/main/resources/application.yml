spring:
  config:
    import:
      - "optional:file:.env.local[.properties]"
  application:
    name: signlight-api
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads — tải chủ yếu là I/O-bound (techstack)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signlight}
    username: ${SPRING_DATASOURCE_USERNAME:signlight}
    password: ${SPRING_DATASOURCE_PASSWORD:signlight}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      pool-name: signlight-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: false   # thiếu khoá -> ném lỗi để phát hiện sớm
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:signlight.forwork@gmail.com}
    password: ${MAIL_PASSWORD:zvgemrbhymirmqie}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
  web:
    locale-resolver: accept_header
    # Client không gửi Accept-Language thì phải rơi về tiếng Việt, không phải locale của máy chủ —
    # người dùng mục tiêu ở Việt Nam (BRD §3).
    locale: vi

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","traceId":"%X{requestId:-}","logger":"%logger{36}","msg":"%m"}%n'
  level:
    vn.duy.signlight: INFO

