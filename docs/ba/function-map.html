<!DOCTYPE html>
<!--
  FUNCTION MAP / BẢN ĐỒ CÂY TÍNH NĂNG — mẫu của BA, Mytel SDLC Kit
  ===========================================================================
  MỤC ĐÍCH: 1 trang HTML để QUẢN LÝ nắm nhanh độ phủ tính năng —
    • Cây tính năng gom theo MODULE / nhóm nghiệp vụ (thẻ lưới)
    • Mỗi tính năng gắn NỀN TẢNG: 📱 App / 🖥 CMS / Cả hai
    • TRẠNG THÁI đặc tả: Đã đặc tả / Một phần·chưa rõ / Chưa đặc tả / Ngoài phạm vi
    • Badge VERSION (vd v0.5) đánh dấu tính năng mới đặc tả ở phiên bản nào
    • Panel "Đã bổ sung ở <version>" tóm tắt thay đổi gần nhất
    • Mã SCR màn hình tham chiếu FSD; mã FR tham chiếu SRS
  Sinh ở B2 (cùng SRS), cập nhật xuyên suốt. Lưu: docs/ba/function-map.html
    (kiểu B microservices: docs/function-map.html — mức tổng thể, gộp theo nghiệp vụ).

  CÁCH DÙNG (BA): CHỈ sửa biến DATA bên dưới, trang tự render.
    - platform: 'app' | 'cms' | 'both'
    - status:   'done' (đặc tả đủ) | 'partial' (một phần/chưa rõ) | 'none' (chưa) | 'na' (ngoài phạm vi)
    - version:  (tuỳ chọn) '0.5'… → hiện badge; đặt DATA.milestone để đếm "mới ở vX" trên thẻ thống kê
    - fr / scr: mã truy vết về SRS (FR-xx) và FSD (SCR-xx)
  Dữ liệu ví dụ dùng tình huống "gói cước data" — THAY bằng dự án thật rồi xoá phần mẫu.
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignLight — Bản đồ chức năng</title>
<style>
  :root{

  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .wrap{max-width:1160px;margin:0 auto;padding:26px 26px 70px}
  .kick{font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.14em;color:var(--done);text-transform:uppercase;margin-bottom:6px}
  h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.5px}
  .lead{color:#40474f;max-width:760px;margin:0 0 6px}
  .lead .v{color:var(--ver);font-weight:600}
  .meta{color:var(--muted);font-size:13px}
  /* stats */
  .stats{display:flex;flex-wrap:wrap;gap:14px;margin:20px 0 6px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:150px;flex:1}
  .tile .n{font-size:30px;font-weight:800;line-height:1}
  .tile .l{font-size:12.5px;color:var(--muted);margin-top:6px}
  .tile.done .n{color:var(--done)} .tile.mile .n{color:#1a7f8c} .tile.partial .n{color:var(--partial)} .tile.none .n{color:var(--none)}
  /* tabs + legend */
  .tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;gap:4px;margin:18px 0 12px}
  .tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);border:0;background:none}
  .tab.on{background:var(--done);color:#fff}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .dot.done{background:var(--done)} .dot.partial{background:var(--partial)} .dot.none{background:var(--none)} .dot.na{background:var(--na)}
  .vbadge{font:600 11px/1 ui-monospace,monospace;color:var(--ver);background:var(--ver-bg);padding:3px 6px;border-radius:5px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .tools input,.tools select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff}
  .tools input[type=search]{flex:1;min-width:200px}
  /* changelog */
  .changelog{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--done);border-radius:12px;padding:16px 18px;margin:6px 0 20px}
  .changelog h3{margin:0 0 4px;font-size:16px}
  .changelog .cl-sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .cl-item{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
  .cl-item:first-of-type{border-top:0}
  .cl-code{font:600 11px/1.7 ui-monospace,monospace;color:var(--ver);background:var(--ver-bg);padding:2px 8px;border-radius:6px;white-space:nowrap;height:fit-content}
  .cl-item b{font-weight:700}
  .cl-item .d{color:#4a515a}
  /* module grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .mod{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--done);border-radius:12px;padding:14px 16px}
  .mcode{font:600 12px/1 ui-monospace,monospace;color:var(--muted)}
  .mname{font-size:17px;font-weight:800;margin:3px 0 4px}
  .mscr{font:12px/1.5 ui-monospace,monospace;color:var(--muted);margin-bottom:8px}
  .feat{display:flex;align-items:flex-start;gap:9px;padding:9px 4px;border-top:1px solid #f1f3f6}
  .feat:first-of-type{border-top:0}
  .fname{flex:1;min-width:0}
  .fname .t{font-weight:600}
  .fname .fr{font:11px/1 ui-monospace,monospace;color:var(--muted)}
  .fname .note{color:var(--muted);font-size:12px;margin-top:2px}
  .badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap}
  .plat{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .plat.app{background:var(--app-bg);color:var(--app)} .plat.cms{background:var(--cms-bg);color:var(--cms)} .plat.both{background:var(--both-bg);color:var(--both)}
  .hidden{display:none!important}
  footer{max-width:1160px;margin:0 auto;padding:0 26px 40px;color:var(--muted);font-size:12px}
  @media print{.tools,.tabs{display:none}.mod,.changelog{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">

      <option value="na">Ngoài phạm vi</option>
    </select>
  </div>

  <div id="changelog"></div>
  <div class="grid" id="grid"></div>
</div>
<footer id="foot"></footer>

    { code:"M9", fr:"FR-39→40", name:"Nền tảng & Vận hành", scr:{cms:"—"},
      features:[
        {name:"Email giao dịch & nhắc học theo múi giờ", fr:"FR-39", platform:"both", status:"done"},
        {name:"Nhật ký có traceId & số liệu sản phẩm", fr:"FR-40", platform:"cms", status:"done", note:"Cấm PII trong log. Đo BG-07: AI có giúp người học không."}
      ]
    },
    { code:"M11", fr:"—", name:"Ngoài phạm vi Giai đoạn 1", scr:{},
      features:[
        {name:"Ứng dụng di động native (Flutter)", fr:"—", platform:"app", status:"na", note:"GĐ2 — repo EXE101 đã có flutter_mvp/, tái dùng được."},
        {name:"Cổng B2B: tổ chức, ghế, dashboard admin", fr:"—", platform:"cms", status:"na", note:"GĐ2 — cần khách hàng doanh nghiệp thật trước."},
        {name:"Đặt lịch luyện tập với giáo viên Điếc", fr:"—", platform:"app", status:"na", note:"GĐ2 — bài toán vận hành."},
        {name:"Ngôn ngữ ký hiệu thứ hai (ASL, BSL…)", fr:"—", platform:"app", status:"na", note:"GĐ2 — mỗi ngôn ngữ cần kho nội dung VÀ mô hình AI riêng."},
        {name:"Học ngoại tuyến, gói gia đình, tặng quà", fr:"—", platform:"app", status:"na", note:"GĐ2."}
      ]
    }
  ]
};
/* =================== HẾT PHẦN BA CẦN SỬA =================== */

const ST={done:"Đã đặc tả",partial:"Một phần / chưa rõ",none:"Chưa đặc tả",na:"Ngoài phạm vi"};
const PLAT={app:{c:"app",t:"Web"},cms:{c:"cms",t:"CMS"},both:{c:"both",t:"Cả hai"}};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const allFeats=()=>DATA.modules.flatMap(m=>m.features);

// counts
let c={done:0,partial:0,none:0,na:0,mile:0};
allFeats().forEach(f=>{c[f.status]=(c[f.status]||0)+1; if(DATA.milestone&&f.version===DATA.milestone)c.mile++;});
const appN=allFeats().filter(f=>f.platform!=='cms').length, cmsN=allFeats().filter(f=>f.platform!=='app').length;

document.getElementById('kick').textContent=[DATA.project,DATA.category,"ĐỘ PHỦ TÍNH NĂNG",DATA.coverageLabel].filter(Boolean).join("  ·  ");
document.getElementById('title').textContent="Bản đồ cây tính năng theo module & nền tảng";
document.getElementById('lead').innerHTML=`Toàn bộ tính năng gom theo <b>module</b>; mỗi tính năng gắn <b>nền tảng</b> (🌐 Web người học / 🖥 CMS quản trị / cả hai) và <b>trạng thái độ phủ đặc tả</b>.`+(DATA.milestone?` Nhãn <span class="v">v${DATA.milestone}</span> = mới đặc tả ở phiên bản đó.`:``);
document.getElementById('meta').textContent=`${DATA.modules.length} module · ${appN} tính năng trên App · ${cmsN} trên CMS · Cập nhật ${DATA.updated}`;
document.getElementById('foot').textContent="Sinh bởi BA (Mytel SDLC Kit) ở B2, cập nhật xuyên suốt. Trạng thái phản ánh mức độ đặc tả trong SRS/FSD — 'Chưa đặc tả' là lỗ hổng cần bổ sung trước khi thiết kế/thi công.";

// stats
const tiles=[
  {cls:"",n:DATA.modules.length,l:"Module hiển thị"},
  {cls:"done",n:c.done,l:"Đã đặc tả"}
];
if(DATA.milestone) tiles.push({cls:"mile",n:c.mile,l:`Mới ở v${DATA.milestone}`});
tiles.push({cls:"partial",n:c.partial,l:"Một phần / chưa rõ"});
tiles.push({cls:"none",n:c.none,l:"Chưa đặc tả"});
document.getElementById('stats').innerHTML=tiles.map(t=>`<div class="tile ${t.cls}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join('');

// tabs
const tabs=[{id:"",name:"Tất cả",icon:""}].concat(DATA.platforms.map(p=>({id:p.id,name:p.name,icon:p.icon})));
document.getElementById('tabs').innerHTML=tabs.map((t,i)=>`<button class="tab${i===0?' on':''}" data-plat="${t.id}">${t.icon?t.icon+' ':''}${t.name}</button>`).join('');

// module cards
function featRow(f){
  const p=PLAT[f.platform]||PLAT.both;
  const row=el('div','feat');
  row.dataset.plat=f.platform; row.dataset.status=f.status;
  row.dataset.text=(f.name+' '+(f.fr||'')+' '+(f.note||'')).toLowerCase();
  row.innerHTML=`<span class="dot ${f.status}" title="${ST[f.status]}"></span>
    <div class="fname"><span class="t">${f.name}</span> <span class="fr">${f.fr||''}</span>
      ${f.note?`<div class="note">${f.note}</div>`:''}</div>
    <div class="badges"><span class="plat ${p.c}">${p.t}</span>${f.version?`<span class="vbadge">v${f.version}</span>`:''}</div>`;
  return row;
}
const grid=document.getElementById('grid');
DATA.modules.forEach(m=>{
  const card=el('div','mod'); card.dataset.mod=m.code;
  const scr=[m.scr&&m.scr.app?`📱 ${m.scr.app}`:'', m.scr&&m.scr.cms?`🖥 ${m.scr.cms}`:''].filter(Boolean).join(' · ');
  card.innerHTML=`<div class="mcode">${m.code} · ${m.fr||''}</div><div class="mname">${m.name}</div>${scr?`<div class="mscr">${scr}</div>`:''}`;
  m.features.forEach(f=>card.appendChild(featRow(f)));
  grid.appendChild(card);
});

// changelog
if(DATA.changelog){
  const cl=DATA.changelog;
  document.getElementById('changelog').innerHTML=
   `<div class="changelog"><h3>✅ ${cl.title}</h3><div class="cl-sub">${cl.sub||''}</div>
     ${cl.items.map(i=>`<div class="cl-item"><span class="cl-code">${i.code}${i.ver?' · v'+i.ver:''}</span>
       <div><b>${i.title}</b> <span class="d">${i.desc||''}</span></div></div>`).join('')}</div>`;
}

// filter
let curPlat="";
function applyFilter(){
  const q=document.getElementById('q').value.trim().toLowerCase(), s=document.getElementById('fStatus').value;
  document.querySelectorAll('.mod').forEach(card=>{
    let shown=0;
    card.querySelectorAll('.feat').forEach(f=>{
      const okP=!curPlat|| f.dataset.plat===curPlat || f.dataset.plat==='both';
      const okS=!s|| f.dataset.status===s;
      const okQ=!q|| f.dataset.text.includes(q);
      const ok=okP&&okS&&okQ; f.classList.toggle('hidden',!ok); if(ok)shown++;
    });
    card.classList.toggle('hidden',shown===0);
  });
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); b.classList.add('on');
  curPlat=b.dataset.plat; applyFilter();
});
['q','fStatus'].forEach(id=>document.getElementById(id).addEventListener('input',applyFilter));
</script>
</body>
</html>
