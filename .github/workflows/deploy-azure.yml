name: Deploy Azure containers

on:
  workflow_dispatch:
  push:
    branches: [develope]
    paths:
      - "src/backend/**"
      - "src/ai/**"
      - ".github/workflows/deploy-azure.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
  AI_APP_NAME: ${{ vars.AZURE_AI_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test API
        working-directory: src/backend
        run: mvn -B test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/ai/requirements.txt

      - name: Test AI
        working-directory: src/ai
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          docker build --tag "$LOGIN_SERVER/signlight-api:${GITHUB_SHA}" src/backend
          docker push "$LOGIN_SERVER/signlight-api:${GITHUB_SHA}"
          docker build --tag "$LOGIN_SERVER/signlight-ai:${GITHUB_SHA}" src/ai
          docker push "$LOGIN_SERVER/signlight-ai:${GITHUB_SHA}"

      - name: Deploy immutable image revisions
        run: |
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AI_APP_NAME" \
            --image "$LOGIN_SERVER/signlight-ai:${GITHUB_SHA}"
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --image "$LOGIN_SERVER/signlight-api:${GITHUB_SHA}"

      - name: Verify API health
        run: |
          API_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 8 --retry-delay 15 --retry-all-errors "https://${API_FQDN}/health"
